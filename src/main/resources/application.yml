server:
  address: 0.0.0.0
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

spring:
  profiles:
    active: local

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  web:
    error:
      include-stacktrace: never
      include-message: always
      whitelabel:
        enabled: false

app:
  seed:
    enabled: true